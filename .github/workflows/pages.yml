# Backup publisher for GitHub Pages, run by hand: Actions tab -> "Publish site" -> Run workflow.
# Normal publishing is Settings -> Pages -> "Deploy from a branch" (main). If that gets stuck again
# (it timed out for hours on 2026-10-06), switch Pages Source to "GitHub Actions" and run this.
# The site is plain HTML/CSS/JS, so it is uploaded as-is (no Jekyll build).
name: Publish site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
