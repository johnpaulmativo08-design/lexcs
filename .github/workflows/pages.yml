# Publishes the site to GitHub Pages on every push to main (or by hand from the Actions tab).
# Used instead of "Deploy from a branch" because that route kept timing out on 2026-10-06.
# The site is plain HTML/CSS/JS, so it is uploaded as-is (no Jekyll build).
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
