<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Order Payment · LexC's Snacktime</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/brand.css?v=4"><link rel="stylesheet" href="payment.css?v=8"><link rel="stylesheet" href="../shared/motion.css?v=2">
  <script src="../shared/vendor/supabase.js"></script><script src="../shared/supabase-config.js"></script>
  <script src="../shared/supabase-client.js?v=6"></script><script src="payment.js?v=8" defer></script><script src="../shared/motion.js?v=2" defer></script>
</head>
<body>
  <header><a href="../">LexC's Snacktime</a><span>QR payment · manually verified</span></header>
  <main>
    <nav aria-label="Breadcrumb"><a id="back-to-orders" href="../">← Back to My Orders</a> <span>›</span> Payment</nav>
    <h1>Order payment</h1>
    <p class="lead">Your order is saved. LexC’s confirms it first, then you pay the downpayment or the full amount by QR and send your bank receipt for review.</p>
    <div class="flow-steps" aria-label="Payment steps"><span data-step="1"><b>1</b> LexC’s confirms</span><span data-step="2"><b>2</b> Choose payment</span><span data-step="3"><b>3</b> Send payment</span><span data-step="4"><b>4</b> Verify transfer</span></div>
    <div id="feedback" role="status" hidden></div>
    <div id="payment-content" aria-live="polite" aria-busy="true"><section class="payment-skeleton" role="status" aria-label="Loading your saved order"><div class="payment-skeleton-strip skel-panel" aria-hidden="true"><span class="skel skel-line skel-line--short"></span><span class="skel skel-value"></span><span class="skel skel-badge"></span></div><div class="payment-skeleton-grid"><div class="skel-panel" aria-hidden="true"><span class="skel skel-title"></span><div class="payment-skeleton-main"><span class="skel skel-image skel-image--square"></span><span class="skel-stack"><span class="skel skel-line"></span><span class="skel skel-value"></span><span class="skel skel-line skel-line--long"></span><span class="skel skel-button"></span></span></div></div><div class="skel-panel skel-stack" aria-hidden="true"><span class="skel skel-title"></span><span class="skel skel-line skel-line--long"></span><span class="skel skel-line"></span><span class="skel skel-line skel-line--short"></span><span class="skel skel-line skel-line--long"></span></div></div></section></div>
  </main>
</body>
</html>
